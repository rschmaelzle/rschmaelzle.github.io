// ---------- Online-Multiplayer (PeerJS / WebRTC) ----------
const ONLINE_OK = !window.ELFMETER_NO_ONLINE;
const NET={ peer:null, host:false, code:'', conns:new Map(), hostConn:null, players:[], myId:'host', inMatch:false, finalizeTimer:null, game:'pen' };
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', PEER_PREFIX='elfmeterblitz-v1-';
function genCode(){ let s=''; for(let i=0;i<5;i++) s+=CODE_CHARS[(Math.random()*CODE_CHARS.length)|0]; return s; }
function loadPeerJS(){ return new Promise((res,rej)=>{ if(window.Peer) return res();
  const s=document.createElement('script'); s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=()=>res(); s.onerror=()=>rej(new Error('Netzwerk-Bibliothek konnte nicht geladen werden.')); document.head.appendChild(s); }); }
function netReset(){ try{ NET.peer && NET.peer.destroy(); }catch(e){} clearTimeout(NET.finalizeTimer);
  Object.assign(NET,{peer:null,host:false,code:'',hostConn:null,players:[],myId:'host',inMatch:false}); NET.conns=new Map(); }
function me(){ const p=getActive(); return { name:p.name, color:p.color, number:p.number, level:p.level, ovr:ovr(p) }; }
function scrOnline(){
  netReset();
  show(`<h2>🌐 Online-Multiplayer</h2>
    <p class="muted" style="margin-top:-6px">Alle spielen gleichzeitig auf ihrem Gerät – live siehst du die Punkte der anderen. Bis zu 6 Spieler. Der Host wählt die Disziplin.</p>
    <div class="btns"><button class="big primary" data-a="hostRoom">＋ Raum erstellen</button></div>
    <h3>Oder Raum beitreten</h3>
    <input type="text" id="codeIn" class="code-input" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <div class="row"><button class="green" data-a="joinRoom">Beitreten →</button></div>
    <div class="err" id="netErr"></div>
    <div class="row"><button data-a="home">← Zurück</button></div>`);
  $('#codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') A.joinRoom(); });
  $('#codeIn').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
}
function netError(msg){ const el=$('#netErr'); if(el) el.textContent=msg; else toast('⚠️ '+esc(msg)); }
function scrConnecting(txt){ show(`<h2>🌐 Online</h2><p class="center"><span class="spin"></span>${txt}</p><div class="row"><button data-a="leaveOnline">Abbrechen</button></div>`); }
async function hostRoom(attempt=0){
  scrConnecting('Raum wird erstellt …');
  try{ await loadPeerJS(); }catch(e){ scrOnline(); netError(e.message); return; }
  netReset(); NET.host=true; NET.code=genCode(); NET.myId='host'; NET.game=store.game;
  NET.players=[{ id:'host', ...me(), score:0, shots:0, done:false }];
  const peer=new Peer(PEER_PREFIX+NET.code); NET.peer=peer;
  peer.on('open', ()=>scrLobby());
  peer.on('connection', conn=>{
    conn.on('open', ()=>{ if(NET.players.length>=6 || NET.inMatch){ conn.send({t:'full', inMatch:NET.inMatch}); setTimeout(()=>conn.close(),300); return; } NET.conns.set(conn.peer, conn); });
    conn.on('data', d=>hostOnData(conn,d));
    conn.on('close', ()=>{ NET.conns.delete(conn.peer); const pl=NET.players.find(x=>x.id===conn.peer);
      NET.players=NET.players.filter(x=>x.id!==conn.peer); if(pl) toast(`${esc(pl.name)} hat den Raum verlassen`);
      broadcastLobby(); refreshNetViews(); if(NET.inMatch) maybeFinalize(); });
  });
  peer.on('error', e=>{ if(e.type==='unavailable-id' && attempt<3) return hostRoom(attempt+1); scrOnline(); netError('Verbindungsfehler: '+(e.type||e.message||e)); });
}
function broadcast(msg){ for(const c of NET.conns.values()){ try{ c.open && c.send(msg); }catch(e){} } }
const broadcastLobby = () => broadcast({t:'lobby',players:NET.players,game:NET.game});
function hostOnData(conn,d){
  if(!d||typeof d!=='object') return;
  if(d.t==='hello'){
    const pl={ id:conn.peer, name:String(d.name||'Gast').slice(0,14), color:/^#[0-9a-f]{3,8}$/i.test(d.color)?d.color:'#2563eb',
      number:(d.number|0)||9, level:d.level|0, ovr:d.ovr|0, score:0, shots:0, done:false };
    NET.players=NET.players.filter(x=>x.id!==conn.peer); NET.players.push(pl);
    conn.send({t:'welcome', id:conn.peer, code:NET.code}); broadcastLobby(); refreshNetViews(); SFX.beep(true);
  } else if(d.t==='score' || d.t==='final'){
    const pl=NET.players.find(x=>x.id===conn.peer); if(!pl) return;
    pl.score=d.score|0; pl.shots=d.shots|0; if(d.t==='final') pl.done=true;
    broadcast({t:'scores',players:NET.players}); refreshNetViews(); if(d.t==='final') maybeFinalize();
  }
}
function hostStartMatch(){
  if(!NET.host) return; netView=''; NET.inMatch=true;
  NET.players.forEach(p=>{ p.score=0; p.shots=0; p.done=false; });
  const self=NET.players.find(p=>p.id==='host'); Object.assign(self, me(), {id:'host'});
  broadcast({t:'start', players:NET.players, game:NET.game});
  startRound(getActive(),'online',NET.game); renderOpp();
}
function maybeFinalize(){ if(NET.host && NET.inMatch && NET.players.every(p=>p.done)) finalizeMatch(); }
function finalizeMatch(){ clearTimeout(NET.finalizeTimer); if(!NET.inMatch) return; NET.inMatch=false; broadcast({t:'result', players:NET.players, game:NET.game}); onlineResult(NET.players); }
function sendToHost(msg){ try{ NET.hostConn && NET.hostConn.open && NET.hostConn.send(msg); }catch(e){} }
async function joinRoom(){
  const code=($('#codeIn').value||'').trim().toUpperCase();
  if(code.length!==5){ netError('Bitte den 5-stelligen Raumcode eingeben.'); return; }
  scrConnecting(`Verbinde mit Raum <b>${esc(code)}</b> …`);
  try{ await loadPeerJS(); }catch(e){ scrOnline(); netError(e.message); return; }
  netReset(); NET.host=false; NET.code=code;
  const peer=new Peer(); NET.peer=peer; let opened=false;
  peer.on('open', id=>{
    NET.myId=id; const conn=peer.connect(PEER_PREFIX+code,{reliable:true}); NET.hostConn=conn;
    conn.on('open', ()=>{ opened=true; conn.send({t:'hello', ...me()}); });
    conn.on('data', d=>guestOnData(d));
    conn.on('close', ()=>{ if(NET.peer===peer){ const playing=G.state==='play'||G.state==='countdown'; toast('⚠️ Verbindung zum Host getrennt');
      if(!playing){ scrOnline(); netError('Verbindung zum Host getrennt.'); } NET.hostConn=null; } });
    setTimeout(()=>{ if(!opened && NET.peer===peer){ scrOnline(); netError('Raum nicht gefunden oder keine Verbindung möglich.'); } },12000);
  });
  peer.on('error', e=>{ if(NET.peer!==peer) return; scrOnline(); netError(e.type==='peer-unavailable' ? `Raum „${code}“ nicht gefunden.` : 'Verbindungsfehler: '+(e.type||e.message||e)); });
}
function guestOnData(d){
  if(!d||typeof d!=='object') return;
  if(d.game && GAMES[d.game]) NET.game=d.game;
  if(d.t==='full'){ scrOnline(); netError(d.inMatch?'Das Match läuft bereits – bitte gleich nochmal versuchen.':'Der Raum ist voll.'); return; }
  if(d.t==='welcome'){ NET.myId=d.id; scrLobby(); }
  else if(d.t==='lobby'){ NET.players=d.players||[]; refreshNetViews(); }
  else if(d.t==='scores'){ NET.players=d.players||[]; renderOpp(); refreshNetViews(); }
  else if(d.t==='start'){ netView=''; NET.players=d.players||[]; NET.inMatch=true; startRound(getActive(),'online',NET.game); renderOpp(); }
  else if(d.t==='result'){ NET.inMatch=false; NET.players=d.players||[]; onlineResult(NET.players); }
}
let netView='';
function refreshNetViews(){ if(netView==='lobby') scrLobby(); else if(netView==='wait') scrWait(); renderOpp(); }
function scrLobby(){
  netView='lobby'; const g=NET.game;
  show(`<h2>🌐 Lobby</h2>
    <p class="muted center" style="margin:0">Raumcode – an Freunde weitergeben:</p>
    <div class="codebox">${esc(NET.code)}</div>
    <div class="row" style="margin-top:0"><button data-a="copyCode">📋 Code kopieren</button></div>
    <h3>Disziplin ${NET.host?'':'(wählt der Host)'}</h3>
    <div class="modes" style="margin-top:0">${Object.entries(GAMES).map(([k,m])=>`<button class="mode ${k===g?'sel':''}" ${NET.host?`data-a="pickGameOnline" data-v="${k}"`:'disabled'}><span class="mi">${m.icon}</span><b>${m.name}</b><small>${m.time} s</small></button>`).join('')}</div>
    <h3>Spieler (${NET.players.length}/6)</h3>
    ${NET.players.map(p=>`<div class="rank ${p.id===NET.myId?'first':''}">${jerseySVG(p,30)}<div class="n">${esc(p.name)} ${p.id==='host'?'<span class="muted">· Host</span>':''}${p.id===NET.myId?' <span class="muted">(du)</span>':''}</div><div class="muted">OVR ${p.ovr||'–'}</div></div>`).join('')}
    ${NET.host ? `<div class="btns"><button class="big primary" data-a="hostStart" ${NET.players.length<2?'disabled':''}>${NET.players.length<2?'Warte auf Mitspieler …':'⚽ Anpfiff!'}</button></div>`
               : `<p class="center muted"><span class="spin"></span>Warte auf den Anpfiff des Hosts …</p>`}
    <div class="row"><button data-a="leaveOnline">Raum verlassen</button></div>`);
}
function renderOpp(){
  const el=$('#hudOpp');
  if(G.mode!=='online' || !(G.state==='play'||G.state==='countdown')){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const mine=NET.players.find(p=>p.id===NET.myId); if(mine && G.r){ mine.score=G.r.score; mine.shots=G.r.shots; }
  el.innerHTML=[...NET.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="o ${p.id===NET.myId?'me':''}"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}${p.done?' ✓':''}<b>${p.score}</b></div>`).join('');
}
function netScoreUpdate(){
  if(G.mode!=='online') return; const r=G.r;
  if(NET.host){ const s=NET.players.find(p=>p.id==='host'); if(s){ s.score=r.score; s.shots=r.shots; } broadcast({t:'scores',players:NET.players}); }
  else sendToHost({t:'score',score:r.score,shots:r.shots});
  renderOpp();
}
let onlineSummary=null;
function onlineAfterRound(s){
  onlineSummary=s;
  if(NET.host){ const self=NET.players.find(p=>p.id==='host'); if(self){ self.score=s.r.score; self.shots=s.r.shots; self.done=true; }
    broadcast({t:'scores',players:NET.players}); clearTimeout(NET.finalizeTimer); NET.finalizeTimer=setTimeout(finalizeMatch, 12000); scrWait(); maybeFinalize(); }
  else { sendToHost({t:'final',score:s.r.score,shots:s.r.shots}); scrWait();
    if(!NET.hostConn) onlineResult(NET.players.map(p=>p.id===NET.myId?{...p,score:s.r.score,shots:s.r.shots,done:true}:p)); }
}
function scrWait(){
  netView='wait'; const s=onlineSummary;
  show(`<h2 class="center">Abpfiff!</h2><div class="bigscore">${s?s.r.score:0}<small>deine ${GAMES[NET.game].unit}</small></div>
    <p class="center muted"><span class="spin"></span>Warte auf die anderen Spieler …</p>
    ${[...NET.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="rank">${jerseySVG(p,28)}<div class="n">${esc(p.name)}</div><div class="muted">${p.done?'fertig ✓':'spielt …'}</div><div class="g">${p.score}</div></div>`).join('')}
    ${s?rewardsHTML(s):''}`);
}
function onlineResult(players){
  netView='result';
  const ranked=[...players].sort((a,b)=>b.score-a.score || a.shots-b.shots);
  const top=ranked.length?ranked[0].score:0, winners=ranked.filter(p=>p.score===top);
  const iWon = top>0 && winners.length===1 && winners[0].id===NET.myId && players.length>1;
  const p=getActive(); let bonus=0, ups=0;
  if(iWon){ p.wins=(p.wins||0)+1; bonus=30; ups=addXP(p,bonus); SFX.cheer(true); confetti(CX,H*0.3,p.color,120); }
  const ach=checkAch(p,{online:true, mpWin:iWon}); saveStore();
  const extra = (bonus||ach.length) ? rewardsHTML({p,xp:bonus,ups,ach},'XP Siegbonus für') : '';
  show(`<h2 class="center">${iWon?'🏆 Du hast gewonnen!':'Endstand'} · ${GAMES[NET.game].name}</h2>
    ${ranked.map((x,i)=>`<div class="rank ${x.score===top&&top>0?'first':''}"><div class="pos">${x.score===top&&top>0?'🥇':(i+1)+'.'}</div>${jerseySVG(x,30)}<div class="n">${esc(x.name)}${x.id===NET.myId?' <span class="muted">(du)</span>':''} <span class="muted">· OVR ${x.ovr||'–'}</span></div><div class="g">${x.score}</div></div>`).join('')}
    ${extra}
    ${NET.host?`<div class="btns"><button class="big primary" data-a="hostStart" ${NET.players.length<2?'disabled':''}>↻ Revanche</button></div>`:`<p class="center muted">Der Host kann eine Revanche starten.</p>`}
    <div class="row"><button data-a="lobbyBack">Lobby</button><button data-a="leaveOnline">Raum verlassen</button></div>`);
}

// ---------- Aktionen ----------
function armButton(btn, label, reset){ if(btn.dataset.armed) return true; btn.dataset.armed='1'; btn.textContent=label;
  clearTimeout(btn._t); btn._t=setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed=''; btn.textContent=reset; } },3000); return false; }
const A = {
  home(){ netView=''; scrHome(); },
  solo(){ startRound(getActive(),'solo',store.game); },
  pickGame(g){ if(GAMES[g]){ store.game=g; saveStore(); scrHome(); } },
  upgrades(){ scrUpgrades(); }, achievements(){ scrAchievements(); }, ranking(){ scrRanking(); }, profiles(){ scrProfiles(); },
  up(k){ const p=getActive(), v=p.stats[k], c=upCost(v); if(v<MAXR && p.sp>=c){ p.sp-=c; p.stats[k]=Math.min(MAXR,v+STEP); SFX.up();
    const ach=checkAch(p,{}); ach.forEach(a=>toast(`${a.icon} Erfolg: ${a.name} (+${a.sp} ✦)`)); saveStore(); scrUpgrades(); } },
  opt(v){ const i=v.indexOf('|'), key=v.slice(0,i), val=v.slice(i+1);
    if(key.startsWith('look.')) draft.look[key.slice(5)]=val; else draft[key]=val; scrEditor(); },
  saveDraft(){
    const name=(draft.name||'').trim(); if(!name){ $('#edErr').textContent='Bitte gib deinem Spieler einen Namen.'; $('#pName').focus(); return; }
    const num = draft.number===''||isNaN(draft.number) ? 9 : clamp(draft.number|0,0,99);
    if(draftNew){ const p=newProfile({...draft, name, number:num});
      if(draftBack==='local'){ localSel.add(p.id); saveStore(); scrLocalSetup(); return; }
      store.activeId=p.id; saveStore(); toast(`✓ ${esc(p.name)} ist bereit!`); scrHome(); }
    else { const p=getActive(); Object.assign(p,{ name:name.slice(0,14), number:num, pos:draft.pos, color:draft.color, look:{...draft.look} }); saveStore(); toast('✓ Gespeichert'); scrProfiles(); }
  },
  editProfile(){ startDraft(false,'profiles'); },
  newProfile(){ startDraft(true,'profiles'); },
  newLocalProfile(){ startDraft(true,'local'); },
  pick(id){ store.activeId=id; saveStore(); scrProfiles(); },
  del(id){ const q=getProfile(id); if(!q) return; const btn=panel.querySelector(`[data-a=del][data-v="${id}"]`);
    if(btn && !armButton(btn,'Wirklich löschen?','🗑')) return;
    store.profiles=store.profiles.filter(x=>x.id!==id); localSel.delete(id); if(store.activeId===id) store.activeId=store.profiles[0].id; saveStore(); scrProfiles(); },
  local(){ scrLocalSetup(); },
  pickGameLocal(g){ if(GAMES[g]){ store.game=g; saveStore(); scrLocalSetup(); } },
  toggleLocal(id){ if(localSel.has(id)) localSel.delete(id); else if(localSel.size<6) localSel.add(id); scrLocalSetup(); },
  startLocal(){ LOCAL.ids=[...localSel].filter(id=>getProfile(id)); if(LOCAL.ids.length<2) return scrLocalSetup(); LOCAL.idx=0; LOCAL.results=[]; LOCAL.game=store.game; localReadyScreen(); },
  localGo(){ startRound(getProfile(LOCAL.ids[LOCAL.idx]),'local',LOCAL.game); },
  localNext(){ localReadyScreen(); },
  online(){ scrOnline(); }, hostRoom(){ hostRoom(); }, joinRoom(){ joinRoom(); },
  pickGameOnline(g){ if(NET.host && GAMES[g]){ NET.game=g; broadcastLobby(); scrLobby(); } },
  hostStart(){ if(NET.players.length>=2) hostStartMatch(); },
  copyCode(){ try{ navigator.clipboard.writeText(NET.code).then(()=>toast('📋 Code kopiert: '+NET.code),()=>toast('Code: '+NET.code)); }catch(e){ toast('Code: '+NET.code); } },
  lobbyBack(){ if(NET.peer && (NET.host || NET.hostConn)) scrLobby(); else scrOnline(); },
  leaveOnline(){ netView=''; netReset(); scrHome(); },
  quit(){
    const qb=$('#quitBtn'); if(!armButton(qb,'Wirklich abbrechen?','✕ Abbrechen')) return;
    qb.dataset.armed=''; qb.textContent='✕ Abbrechen';
    G.state='idle'; G.charging=false; showHUD(false);
    if(G.mode==='online'){ if(NET.host){ const s=NET.players.find(p=>p.id==='host'); if(s) s.done=true; maybeFinalize(); } else sendToHost({t:'final',score:G.r.score,shots:G.r.shots}); netReset(); }
    netView=''; scrHome();
  },
};
panel.addEventListener('click', e=>{ const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; ac(); const f=A[b.dataset.a]; if(f) f(b.dataset.v); });
$('#muteBtn').addEventListener('click', ()=>setMuted(!muted));
$('#quitBtn').addEventListener('click', ()=>A.quit());

// ---------- Start ----------
window.addEventListener('resize', resize);
loadStore(); G.profile=getActive()||null;
if(!G.profile){ G.profile={ name:'', number:9, color:COLORS[0], look:defaultLook(), stats:{...TYPES.all.stats}, level:1 }; }
resetPen(); resize(); setMuted(muted);
if(store.profiles.length===0) startDraft(true,'home'); else { if(!getActive()) store.activeId=store.profiles[0].id; scrHome(); }
requestAnimationFrame(loop);
</script>
</body>
</html>
